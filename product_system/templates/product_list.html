{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Product List</title>
    <link rel="stylesheet"  href="{% static 'styles.css' %}">
</head>
<body>

    <h1>Products</h1>

    {% for product in products %}
        <div class="product">
            <h2>{{ product.name }}</h2>
            <p>Price: ₱{{ product.price }}</p>
        </div>
    {% endfor %}

</body>
</html>
